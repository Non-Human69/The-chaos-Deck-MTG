<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
    <section class="card-image">
        <img class="card-img" id="card-img" src="" alt="Random Card">
    </section>
    <button class="btn-random" onclick="randomizeImage()">Random New Card</button>
    <section class="search-card">
        <label for="search-input">Search a card:</label>
        <input id="search-input" type="number">
        <button class="btn-search" onclick="searchCard()">Search by Number</button>
    </section>
</div>
<script src="index.js"></script>
</body>
</html>
